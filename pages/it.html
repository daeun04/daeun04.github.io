<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>IT개론</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header>
    <div class="logo-area">
      <img src="../img/logo_IT.png" alt="IT개론 로고">

      <div>
        <h2>IT개론</h2>
        <p>학기별 시험 범위 및 수업 정리</p>
      </div>
    </div>
  </header>

  <main class="content">

    <h1>IT개론</h1>

    <h2>학기 선택</h2>

    <div class="semester-box">
      <label for="semester">연도 및 학기 선택</label>

      <select id="semester" name="semester" onchange="changeExamOptions()">
        <option value="">선택하세요</option>
        <option value="2026-1">2026 1학기</option>
        <option value="2026-2">2026 2학기</option>
      </select>
    </div>

    <div class="exam-box">
      <label for="exam">시험 선택</label>

      <select id="exam" name="exam">
        <option value="">학기를 먼저 선택하세요</option>
      </select>
    </div>

    <button class="select-button" onclick="showUnits()">
      선택
    </button>

    <section id="unit-section" class="unit-section">

      <h2>단원별 정리</h2>

      <div class="unit-list">

        <a href="it-1.html" class="unit-card first-midterm-unit">
          <h3>1단원</h3>
          <p>수정중</p>
        </a>

        <a href="it-2.html" class="unit-card first-midterm-unit">
          <h3>2단원</h3>
          <p>수정중</p>
        </a>

        <a href="it-3.html" class="unit-card first-midterm-unit">
          <h3>3단원</h3>
          <p>수정중</p>
        </a>

        <a href="it-4.html" class="unit-card first-midterm-unit">
          <h3>4단원</h3>
          <p>수정중</p>
        </a>

        <a href="it-5.html" class="unit-card first-final-unit">
          <h3>5단원</h3>
          <p>수정중</p>
        </a>

        <a href="it-6.html" class="unit-card first-final-unit">
          <h3>6단원</h3>
          <p>수정중</p>
        </a>

        <a href="it-7.html" class="unit-card first-final-unit">
          <h3>7단원</h3>
          <p>수정중</p>
        </a>

        <a href="it-8.html" class="unit-card first-final-unit">
          <h3>8단원</h3>
          <p>수정중</p>
        </a>

      </div>

      <p id="editing-message" style="display: none;">수정중</p>
      
    </section>

    <a href="../index.html" class="back-button">
      메인으로 돌아가기
    </a>

  </main>

 <script>
  function changeExamOptions() {
    const semester = document.getElementById("semester").value;
    const exam = document.getElementById("exam");

    exam.innerHTML = "";

    const defaultOption = document.createElement("option");
    defaultOption.value = "";
    defaultOption.textContent = "선택하세요";
    exam.appendChild(defaultOption);

    if (semester === "2026-1") {
      exam.appendChild(new Option("1학기 중간고사", "first-midterm"));
      exam.appendChild(new Option("1학기 기말고사", "first-final"));
    }

    if (semester === "2026-2") {
      exam.appendChild(new Option("2학기 중간고사", "second-midterm"));
      exam.appendChild(new Option("2학기 기말고사", "second-final"));
    }

    document.getElementById("unit-section").style.display = "none";
    document.getElementById("editing-message").style.display = "none";
  }

  function showUnits() {
    const semester = document.getElementById("semester").value;
    const exam = document.getElementById("exam").value;

    if (semester === "" || exam === "") {
      alert("학기와 시험을 모두 선택하세요.");
      return;
    }

    const unitSection = document.getElementById("unit-section");
    const editingMessage = document.getElementById("editing-message");
    const allUnits = document.querySelectorAll(".unit-card");

    unitSection.style.display = "block";
    editingMessage.style.display = "none";

    allUnits.forEach(function(unit) {
      unit.style.display = "none";
    });

    if (exam === "first-midterm") {
      document.querySelectorAll(".first-midterm-unit").forEach(function(unit) {
        unit.style.display = "";
      });
    }

    if (exam === "first-final") {
      document.querySelectorAll(".first-final-unit").forEach(function(unit) {
        unit.style.display = "";
      });
    }

    if (exam === "second-midterm" || exam === "second-final") {
      editingMessage.style.display = "block";
    }
  }
</script>

</body>
</html>
