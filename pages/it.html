<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>IT개론</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header>

    <div class="logo-area">

      <img src="../img/logo_IT.png" alt="학과 로고">

      <div>
        <h2>IT개론</h2>
        <p>학기별 시험 범위 및 수업 정리</p>
      </div>

    </div>

  </header>

  <main class="content">

    <h1>IT개론</h1>

    <h2>학기 선택</h2>

    <div class="semester-box">

      <label for="semester">
        연도 및 학기 선택
      </label>

      <select id="semester" name="semester">

        <option value="">
          선택하세요
        </option>

        <option value="2026-1">
          2026 1학기
        </option>

        <option value="2026-2">
          2026 2학기
        </option>

      </select>

    </div>

    <br>

    <div class="exam-box">

      <label for="exam">
        시험 범위 선택
      </label>

      <select id="exam" name="exam">

        <option value="">
          선택하세요
        </option>

        <option value="midterm">
          1학기 중간
        </option>

        <option value="final">
          1학기 기말
        </option>

      </select>

    </div>

    <br>

    <button class="select-button">
      선택
    </button>

    <br><br>

    <a href="../index.html" class="back-button">
      메인으로 돌아가기
    </a>

  </main>

</body>
</html>
