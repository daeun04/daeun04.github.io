<!DOCTYPE html>
<!--
=========================================
Margin(바깥 여백) vs Padding(안쪽 여백)
=========================================
■ margin
  - 요소 바깥쪽 여백
  - 요소와 요소 사이의 간격 설정

■ padding
  - 요소 안쪽 여백
  - 콘텐츠와 테두리(border) 사이의 간격 설정

■ 방향별 속성
  - Top    : margin-top,    padding-top
  - Right  : margin-right,  padding-right
  - Bottom : margin-bottom, padding-bottom
  - Left   : margin-left,   padding-left

※ 핵심
  - Margin  = 요소 밖의 간격
  - Padding = 요소 안의 여백
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>예제 6-2 마진(margin)과 패딩(padding)</title>
  <style>
    /* body 기본 스타일 (맥북 화면 맞춤 중앙 정렬 및 가독성 개선) */
    body {
      max-width: 900px;
      margin: 60px auto;       /* 화면 중앙 정렬 */
      padding: 40px;           /* 내부 여백 */
      border: 1px solid #e2e8f0; /* 모던한 연회색 테두리 */
      background-color: #f8fafc; /* 은은한 바탕색 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }

    /* 컨테이너 박스 */
    #container {
      border: 1px solid #cbd5e1; /* 정갈한 그레이 테두리 */
      border-radius: 12px;
      padding: 30px;
      background-color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    #container > p {
      font-weight: 600;
      color: #475569;
      margin-top: 0;
      margin-bottom: 20px;
    }

    /* margin 예시 박스 */
    .box-margin {
      width: 100%;             /* 맥북 해상도 대응 유연한 너비 */
      max-width: 400px;
      height: 60px;
      background: #3b82f6;     /* 세련된 블루 */
      color: #ffffff;
      font-weight: 500;
      display: flex;
      align-items: center;
      padding-left: 20px;
      box-sizing: border-box;
      margin: 30px 0;          /* 외부 요소와의 명확한 간격 */
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.25); /* 소프트 블루 그림자 */
    }

    /* padding 예시 박스 */
    .box-padding {
      width: 100%;
      max-width: 400px;
      height: auto;
      min-height: 100px;
      background: #6366f1;     /* 모던 인디고 */
      color: #ffffff;
      font-weight: 500;
      padding: 30px;           /* 내부 여백 강조 */
      box-sizing: border-box;
      box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.25); /* 소프트 인디고 그림자 */
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <!-- 컨테이너 박스 -->
  <div id="container">
    <!-- body의 margin과 padding 설명 -->
    <p>body { margin-top:20px; margin-left:140px; padding:20px; }</p>

    <!-- margin 예시 박스 -->
    <div class="box-margin">margin:30px;</div>

    <!-- padding 예시 박스 -->
    <div class="box-padding">padding:30px;</div>
  </div>
</body>
</html>
