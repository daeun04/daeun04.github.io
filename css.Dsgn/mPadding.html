<!DOCTYPE html>
<!--=========================================
Margin(바깥 여백) vs Padding(안쪽 여백)
=========================================
■ margin
  - 요소 바깥쪽 여백
  - 요소와 요소 사이의 간격 설정

■ padding
  - 요소 안쪽 여백
  - 콘텐츠와 테두리(border) 사이의 간격 설정

■ 방향별 속성
  - Top    : margin-top,    padding-top
  - Right  : margin-right,  padding-right
  - Bottom : margin-bottom, padding-bottom
  - Left   : margin-left,   padding-left

※ 핵심
  - Margin  = 요소 밖의 간격
  - Padding = 요소 안의 여백
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>예제 6-2 마진(margin)과 패딩(padding)</title>
  <style>
    /* body 기본 스타일 (맥북 화면 맞춤 중앙 정렬) */
    body {
      width: 800px;
      margin: 50px auto;       /* 화면 중앙 정렬 */
      padding: 30px;           /* 내부 여백 */
      border: 1px solid #475569; /* 깔끔한 다크 그레이 테두리 */
      background-color: #f8fafc; /* 은은한 바탕색 */
      font-family: sans-serif;
    }

    /* 컨테이너 박스 */
    #container {
      border: 1px solid #94a3b8; /* 모던 쿨그레이 테두리 */
      padding: 30px;
      background-color: #ffffff;
    }

    /* margin 예시 박스 */
    .box-margin {
      width: 320px;            /* 박스 너비 확장 */
      height: 60px;            /* 박스 높이 */
      background: #2563eb;     /* 모던 블루 */
      color: #ffffff;          /* 글자색 흰색 */
      line-height: 60px;       /* 글자 세로 정렬 */
      text-indent: 15px;       /* 글자 좌측 여백 */
      margin: 40px;            /* 바깥 여백 */
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); /* 은은한 그림자 */
    }

    /* padding 예시 박스 */
    .box-padding {
      width: 320px;
      height: 80px;
      background: #4f46e5;     /* 모던 인디고 */
      color: #ffffff;          /* 글자색 흰색 */
      padding: 40px;           /* 내부 여백 */
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); /* 은은한 그림자 */
      border-radius: 12px;     /* 모서리 둥글게 처리 */
    }
  </style>
</head>
<body>
  <!-- 컨테이너 박스 -->
  <div id="container">
    <!-- body의 margin과 padding 설명 -->
    <p>body { margin-top:20px; margin-left:140px; padding:20px; }</p>

    <!-- margin 예시 박스 -->
    <div class="box-margin">margin:30px;</div>

    <!-- padding 예시 박스 -->
    <div class="box-padding">padding:30px;</div>
  </div>
</body>
</html>
