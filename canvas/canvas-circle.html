<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Circle</title>
</head>
<body>
<canvas id="myCanvas" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

// 위쪽 줄의 원과 반달 (움직이지 않음)
function drawShapes() {
  ctx.beginPath();
  ctx.arc(180, 95, 60, 0, Math.PI * 2);
  ctx.fillStyle = "orange";
  ctx.fill();
  ctx.strokeStyle = "#333";
  ctx.stroke();

  // 반달 (오른쪽이 둥근 반달)
  ctx.beginPath();
  ctx.arc(300, 95, 60, -Math.PI / 2, Math.PI / 2);
  ctx.closePath();
  ctx.fillStyle = "gold";
  ctx.fill();
  ctx.strokeStyle = "#333";
  ctx.stroke();

  // 윗쪽이 잘린 반달 (아래가 둥근 반달)
  ctx.beginPath();
  ctx.arc(440, 95, 60, 0, Math.PI);
  ctx.closePath();
  ctx.fillStyle = "gold";
  ctx.fill();
  ctx.strokeStyle = "#333";
  ctx.stroke();
}

// 피자: (x, y) 위치에 rotation만큼 돌려서 그림
function drawPizza(x, y, rotation) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);

  // 도우(테두리)
  ctx.beginPath();
  ctx.arc(0, 0, 70, 0, Math.PI * 2);
  ctx.fillStyle = "#D2933F";
  ctx.fill();
  ctx.strokeStyle = "#333";
  ctx.stroke();

  // 치즈
  ctx.beginPath();
  ctx.arc(0, 0, 60, 0, Math.PI * 2);
  ctx.fillStyle = "#F4C542";
  ctx.fill();

  // 8조각으로 자르는 선
  ctx.strokeStyle = "#A0522D";
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const angle = (Math.PI * 2 / 8) * i;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(angle) * 70, Math.sin(angle) * 70);
    ctx.stroke();
  }

  // 페퍼로니 (조각마다 하나씩)
  ctx.fillStyle = "#B22222";
  for (let i = 0; i < 8; i++) {
    const angle = (Math.PI * 2 / 8) * i + Math.PI / 8;
    ctx.beginPath();
    ctx.arc(Math.cos(angle) * 38, Math.sin(angle) * 38, 8, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// 피자 굴리기
const pizzaRadius = 70;
const pizzaY = 270;
let pizzaX = 180;
let pizzaRotation = 0;
let speed = 1; // 한 프레임에 움직이는 거리(px). 클수록 빨라짐

function animate() {
  pizzaX += speed;

  // 캔버스 양 끝에 닿으면 방향을 바꿈
  if (pizzaX + pizzaRadius >= canvas.width || pizzaX - pizzaRadius <= 0) {
    speed = -speed;
  }

  // 굴러간 거리만큼 회전 (거리 ÷ 반지름 = 회전 각도)
  pizzaRotation += speed / pizzaRadius;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawShapes();
  drawPizza(pizzaX, pizzaY, pizzaRotation);

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
