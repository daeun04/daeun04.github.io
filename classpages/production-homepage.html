<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>제작 홈페이지</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .project-list {
      display: grid;
      gap: 18px;
      margin-top: 24px;
    }

    .project-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-left: 8px solid #6b7280;
      border-radius: 18px;
      padding: 24px 22px;
      box-shadow: 0 12px 30px rgba(107, 114, 128, 0.12);
    }

    .project-card h3 {
      margin: 0 0 10px;
      font-size: 1.4rem;
      color: #1f2937;
    }

    .project-card p {
      margin: 0 0 14px;
      color: #5b6472;
      line-height: 1.7;
    }

    .project-card a {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(135deg, #4b5563 0%, #7a818a 100%);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      transition: transform 0.2s ease;
    }

    .project-card a:hover {
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <header>
    <div class="logo-area">
      <div class="school-mark" aria-label="AI 소프트웨어과 로고">AI</div>
      <div class="title-wrap">
        <h2>제작 홈페이지</h2>
        <p>개인 프로젝트 웹사이트 모음</p>
      </div>
    </div>
  </header>

  <main class="content">
    <h1>제작 홈페이지</h1>
    <p>다른 홈페이지를 추가할 때마다 아래 카드처럼 연결해두면 관리하기 편합니다.</p>

    <div class="project-list">
      <div class="project-card">
        <h3>LunarRocketArchive</h3>
        <p></p>
        <a href="https://daeun04.github.io/LunarRocketArchive/" target="_blank" rel="noopener noreferrer">사이트 방문</a>
      </div>

      <div class="project-card">
        <h3>추가 홈페이지</h3>
        <p>새로운 웹사이트를 만들면 이 카드 형식처럼 추가하면 됩니다.</p>
        <a href="#">추가 예정</a>
      </div>
    </div>

    <a href="../index.html" class="back-button">홈으로 돌아가기</a>
  </main>

</body>
</html>
